name: Deploy server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一次部署；新推送到来时取消还没跑完的旧部署。
concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'rexxtheone-hue/open-ai-canvas'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::还没有配置 DEPLOY_HOST 和 DEPLOY_SSH_KEY，跳过部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Update server
        if: steps.secrets.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/install-server.sh | sudo env REPOSITORY_URL=https://github.com/${GITHUB_REPOSITORY}.git bash"
