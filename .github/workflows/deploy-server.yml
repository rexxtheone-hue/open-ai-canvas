name: Deploy server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一次部署；新推送到来时取消还没跑完的旧部署。
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'rexxtheone-hue/open-ai-canvas'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::还没有配置 DEPLOY_HOST 和 DEPLOY_SSH_KEY，跳过部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          # 从 Windows 终端复制的私钥常带 \r 和行尾空格，先清理再校验。
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub; then
            echo "::error::DEPLOY_SSH_KEY 不是有效的私钥：请从 -----BEGIN OPENSSH PRIVATE KEY----- 到 -----END OPENSSH PRIVATE KEY----- 整段重新复制"
            exit 1
          fi
          echo "私钥对应的公钥：$(cat ~/.ssh/deploy_key.pub)"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/known_hosts
          if ! timeout 10 bash -c "</dev/tcp/$DEPLOY_HOST/22"; then
            echo "::error::连不上 $DEPLOY_HOST 的 22 端口：检查服务器防火墙（DigitalOcean Cloud Firewall / ufw）是否只允许了你自己的 IP"
            exit 1
          fi
          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" true 2> ssh.log; then
            cat ssh.log
            echo "::error::SSH 登录失败：$(tail -n 1 ssh.log)。请确认上面这把公钥在服务器的 ~/.ssh/authorized_keys 里"
            exit 1
          fi

      - name: Ensure swap
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # 4GB 内存的机器在部署时容易被撑满导致 SSH 卡死，没有 swap 就加 4GB。
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "if ! sudo swapon --show | grep -q .; then sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile && (grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab); fi; free -h"

      - name: Update server
        if: steps.secrets.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/install-server.sh | sudo env REPOSITORY_URL=https://github.com/${GITHUB_REPOSITORY}.git bash"
